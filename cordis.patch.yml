# 个人知识库插件在 profile 插件树里的加载行。
# id 是稳定标识（后续 patch 按 id 覆盖 config）；name 是包名。
- insert:
    - id: knowledge-base
      name: '@fsnh/dsh-plugin-knowledge-base'
      config:
        # 库文件根目录；留空用默认值 $DSH_HOME/kb
        # root: 'D:\\我的资料\\dsh-kb'
        root: ''
        # 单个文件大小上限（字节），默认 64 MiB
        maxFileBytes: 67108864
        # 解析队列并发（1-2 比较稳妥）
        parseConcurrency: 1
        # 向量检索：地址和模型给出厂默认（百炼），**密钥请填在界面上**，
        # 它只写进 $DSH_HOME/kb/settings.json，永远不进这个文件、更不进仓库。
        # enabled 保持 false：没填 Key 之前打开只会让索引白跑一遍。
        embedding:
          enabled: false
          baseUrl: 'https://dashscope.aliyuncs.com/compatible-mode/v1'
          model: 'text-embedding-v4'
