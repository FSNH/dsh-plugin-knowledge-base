<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" role="img" aria-label="知识库面板示意图">
  <defs>
    <style>
      .bg{fill:#ffffff}
      .surface{fill:#f6f8fa}
      .stroke{stroke:#d8dee4}
      .line{stroke:#d8dee4;stroke-width:1}
      .txt{fill:#1f2328;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
      .sub{fill:#57606a;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
      .accent{fill:#1f6feb}
      .accentStroke{stroke:#1f6feb}
      .btnTxt{fill:#1f2328;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;font-size:12px}
      .btnTxtWhite{fill:#ffffff;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;font-size:12px}
      .callout{fill:#1f6feb}
      .calloutTxt{fill:#ffffff;font-family:"Segoe UI",system-ui,sans-serif;font-size:11px;font-weight:600}
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="840"/>

  <!-- 面板外框 -->
  <rect class="bg stroke" x="24" y="24" width="1152" height="656" rx="14"/>

  <!-- 左栏图标条 -->
  <path class="surface" d="M38 24h44v656H38a14 14 0 0 1-14-14V38a14 14 0 0 1 14-14z"/>
  <line class="line" x1="82" y1="24" x2="82" y2="680"/>
  <rect class="accent" x="44" y="46" width="32" height="32" rx="9"/>
  <path d="M55 58h9a3 3 0 0 1 3 3v9h-9a3 3 0 0 1-3-3v-9z" fill="none" stroke="#ffffff" stroke-width="1.6"/>
  <rect class="surface stroke" x="44" y="92" width="32" height="32" rx="9"/>
  <rect x="52" y="100" width="16" height="16" rx="4" fill="none" stroke="#8c959f" stroke-width="1.6"/>
  <rect class="surface stroke" x="44" y="138" width="32" height="32" rx="9"/>
  <circle cx="60" cy="154" r="7" fill="none" stroke="#8c959f" stroke-width="1.6"/>

  <!-- 头部 -->
  <line class="line" x1="82" y1="90" x2="1176" y2="90"/>
  <path d="M100 57l5 5-5 5" fill="none" stroke="#57606a" stroke-width="1.8" stroke-linecap="round"/>
  <text class="txt" x="120" y="66" font-size="14" font-weight="600">知识库</text>
  <rect class="surface stroke" x="176" y="42" width="150" height="30" rx="8"/>
  <text class="txt" x="188" y="62" font-size="12.5">我的资料库 ▾</text>
  <rect class="surface stroke" x="342" y="42" width="330" height="30" rx="8"/>
  <circle cx="358" cy="57" r="4.5" fill="none" stroke="#8c959f" stroke-width="1.6"/>
  <line x1="361.5" y1="60.5" x2="364.5" y2="63.5" stroke="#8c959f" stroke-width="1.6" stroke-linecap="round"/>
  <text class="sub" x="374" y="62" font-size="12">搜索标题或正文（支持中文短词）…</text>
  <rect class="surface stroke" x="852" y="42" width="112" height="30" rx="8"/>
  <text class="btnTxt" x="868" y="62">新建文件夹</text>
  <rect class="accent" x="974" y="42" width="104" height="30" rx="8"/>
  <text class="btnTxtWhite" x="996" y="62">导入文件</text>

  <!-- 文件树 -->
  <line class="line" x1="330" y1="90" x2="330" y2="680"/>
  <rect x="88" y="102" width="236" height="28" rx="7" fill="#f6f8fa"/>
  <path d="M96 111l4 5-4 5" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="106" y="110" width="14" height="12" rx="2.5" fill="none" stroke="#57606a" stroke-width="1.5"/>
  <text class="txt" x="128" y="121" font-size="12.5">示例资料</text>

  <path d="M118 135v20" stroke="#d8dee4" stroke-width="1.5"/>
  <rect x="126" y="150" width="16" height="12" rx="3" fill="none" stroke="#57606a" stroke-width="1.5"/>
  <text class="sub" x="150" y="160" font-size="12.5">产品培训.pptx</text>
  <rect x="126" y="178" width="16" height="12" rx="3" fill="none" stroke="#57606a" stroke-width="1.5"/>
  <text class="sub" x="150" y="188" font-size="12.5">会议纪要.docx</text>
  <rect x="126" y="206" width="16" height="12" rx="3" fill="none" stroke="#57606a" stroke-width="1.5"/>
  <text class="sub" x="150" y="216" font-size="12.5">出口要求.md</text>

  <!-- 文档头 -->
  <text class="txt" x="356" y="122" font-size="15" font-weight="600">示例-产品培训.pptx</text>
  <text class="sub" x="356" y="146" font-size="12">9.2 MB · .pptx · 已索引 · 8 页 · 2 分钟前</text>

  <!-- 操作按钮 -->
  <rect class="accent" x="356" y="160" width="88" height="30" rx="8"/>
  <text class="btnTxtWhite" x="378" y="180">✳ 问 AI</text>
  <rect class="surface stroke" x="452" y="160" width="74" height="30" rx="8"/>
  <text class="btnTxt" x="470" y="180">大屏</text>
  <rect class="surface stroke" x="534" y="160" width="74" height="30" rx="8"/>
  <text class="btnTxt" x="552" y="180">下载</text>
  <rect class="surface stroke" x="616" y="160" width="112" height="30" rx="8"/>
  <rect class="surface" x="619" y="163" width="52" height="24" rx="6"/>
  <text class="txt" x="630" y="180" font-size="11.5" font-weight="600">原版式</text>
  <text class="sub" x="682" y="180" font-size="11.5">文字</text>

  <!-- 阅读器工具条 -->
  <line class="line" x1="330" y1="204" x2="1176" y2="204"/>
  <rect class="surface stroke" x="348" y="214" width="26" height="24" rx="6"/>
  <rect x="354" y="220" width="9" height="12" rx="1.5" fill="none" stroke="#57606a" stroke-width="1.4"/>
  <line x1="368" y1="222" x2="368" y2="230" stroke="#57606a" stroke-width="1.4"/>
  <rect class="surface stroke" x="384" y="214" width="24" height="24" rx="6"/>
  <path d="M399 220l-5 6 5 6" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linecap="round"/>
  <rect class="surface stroke" x="416" y="214" width="44" height="24" rx="6"/>
  <text class="txt" x="434" y="231" font-size="12" text-anchor="middle">4</text>
  <text class="sub" x="468" y="231" font-size="12">/ 123</text>
  <rect class="surface stroke" x="502" y="214" width="24" height="24" rx="6"/>
  <path d="M511 220l5 6-5 6" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linecap="round"/>
  <rect class="surface stroke" x="1002" y="214" width="160" height="24" rx="7"/>
  <rect class="surface" x="1004" y="216" width="70" height="20" rx="5"/>
  <text class="txt" x="1022" y="230" font-size="11.5" font-weight="600">单页</text>
  <text class="sub" x="1088" y="230" font-size="11.5">连续</text>

  <!-- 缩略图栏 -->
  <rect class="surface" x="340" y="250" width="106" height="414" rx="8"/>
  <rect x="348" y="258" width="90" height="50" rx="4" fill="#ffffff" stroke="#d8dee4"/>
  <rect x="348" y="316" width="90" height="50" rx="4" fill="#ffffff" stroke="#d8dee4"/>
  <rect x="346" y="374" width="94" height="54" rx="4" fill="#ffffff" stroke="#1f6feb" stroke-width="2"/>
  <text class="accent" x="386" y="405" font-size="11" text-anchor="middle">4</text>
  <rect x="348" y="436" width="90" height="50" rx="4" fill="#ffffff" stroke="#d8dee4"/>
  <rect x="348" y="494" width="90" height="50" rx="4" fill="#ffffff" stroke="#d8dee4"/>
  <rect x="348" y="552" width="90" height="50" rx="4" fill="#ffffff" stroke="#d8dee4"/>

  <!-- 页面 -->
  <rect x="458" y="250" width="702" height="414" rx="8" fill="#f0f3f6" stroke="#d8dee4"/>
  <rect x="536" y="274" width="546" height="366" rx="4" fill="#ffffff" stroke="#d8dee4"/>
  <rect x="572" y="310" width="200" height="14" rx="4" fill="#e6eaef"/>
  <rect x="572" y="342" width="380" height="10" rx="4" fill="#eef1f4"/>
  <rect x="572" y="362" width="340" height="10" rx="4" fill="#eef1f4"/>
  <rect x="572" y="382" width="400" height="10" rx="4" fill="#eef1f4"/>
  <rect x="572" y="418" width="368" height="120" rx="6" fill="#f6f8fa" stroke="#e6eaef"/>
  <rect x="572" y="556" width="300" height="10" rx="4" fill="#eef1f4"/>
  <rect x="572" y="576" width="256" height="10" rx="4" fill="#eef1f4"/>
  <text class="sub" x="809" y="660" font-size="11.5" text-anchor="middle">96 DPI 逐页图片 · 铺满阅读区</text>

  <!-- 序号标注（白色光晕压在元素角上，避免挡住文字） -->
  <g>
    <circle cx="176" cy="44" r="13" fill="#ffffff"/>
    <circle class="callout" cx="176" cy="44" r="10"/><text class="calloutTxt" x="176" y="48" text-anchor="middle">1</text>
    <circle cx="342" cy="44" r="13" fill="#ffffff"/>
    <circle class="callout" cx="342" cy="44" r="10"/><text class="calloutTxt" x="342" y="48" text-anchor="middle">2</text>
    <circle cx="974" cy="44" r="13" fill="#ffffff"/>
    <circle class="callout" cx="974" cy="44" r="10"/><text class="calloutTxt" x="974" y="48" text-anchor="middle">3</text>
    <circle cx="1002" cy="216" r="13" fill="#ffffff"/>
    <circle class="callout" cx="1002" cy="216" r="10"/><text class="calloutTxt" x="1002" y="220" text-anchor="middle">4</text>
    <circle cx="340" cy="252" r="13" fill="#ffffff"/>
    <circle class="callout" cx="340" cy="252" r="10"/><text class="calloutTxt" x="340" y="256" text-anchor="middle">5</text>
    <circle cx="452" cy="162" r="13" fill="#ffffff"/>
    <circle class="callout" cx="452" cy="162" r="10"/><text class="calloutTxt" x="452" y="166" text-anchor="middle">6</text>
  </g>

  <!-- 图例 -->
  <g font-size="12.5">
    <circle class="callout" cx="40" cy="712" r="9"/><text class="calloutTxt" x="40" y="716" text-anchor="middle">1</text>
    <text class="txt" x="58" y="716">创作/选择知识库</text>
    <circle class="callout" cx="40" cy="742" r="9"/><text class="calloutTxt" x="40" y="746" text-anchor="middle">2</text>
    <text class="txt" x="58" y="746">搜正文（中文两字词也能命中）</text>
    <circle class="callout" cx="40" cy="772" r="9"/><text class="calloutTxt" x="40" y="776" text-anchor="middle">3</text>
    <text class="txt" x="58" y="776">导入 / 新建（落在选中的文件夹）</text>

    <circle class="callout" cx="620" cy="712" r="9"/><text class="calloutTxt" x="620" y="716" text-anchor="middle">4</text>
    <text class="txt" x="638" y="716">页码跳转 + 单页/连续</text>
    <circle class="callout" cx="620" cy="742" r="9"/><text class="calloutTxt" x="620" y="746" text-anchor="middle">5</text>
    <text class="txt" x="638" y="746">缩略图栏：点哪页跳哪页</text>
    <circle class="callout" cx="620" cy="772" r="9"/><text class="calloutTxt" x="620" y="776" text-anchor="middle">6</text>
    <text class="txt" x="638" y="776">大屏放映 · 下载原件 · 问 AI</text>
  </g>
  <text class="sub" x="24" y="812" font-size="11.5">示意图（实际界面跟随 DSH 主题与窗口宽度）</text>
</svg>
