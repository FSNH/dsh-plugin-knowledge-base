<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="知识库界面示例：左侧文件树、右侧原版式阅读器">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>

  <!-- 应用窗口 -->
  <g filter="url(#shadow)">
    <rect x="48" y="48" width="1104" height="624" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  </g>

  <!-- 左侧图标栏 -->
  <rect x="48" y="48" width="72" height="624" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="68" y="76" width="32" height="32" rx="9" fill="#2563eb"/>
  <path d="M76 88h6l3-4 3 8 3-5h5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="68" y="124" width="32" height="32" rx="9" fill="none" stroke="#cbd5e1"/>
  <circle cx="84" cy="140" r="7" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
  <rect x="68" y="172" width="32" height="32" rx="9" fill="none" stroke="#cbd5e1"/>
  <path d="M80 182v12M74 188h12" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>

  <!-- 顶栏 -->
  <rect x="120" y="48" width="1032" height="68" rx="0" fill="#ffffff"/>
  <path d="M120 116h1032" stroke="#e2e8f0"/>
  <path d="M150 82l-8 0M146 76l-6 6 6 6" stroke="#64748b" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="168" y="68" width="28" height="28" rx="8" fill="#2563eb"/>
  <path d="M176 78h10M176 84h10M176 90h6" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <text x="208" y="87" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#0f172a">示例资料</text>
  <path d="M300 78l5 5 5-5" stroke="#64748b" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="326" y="66" width="30" height="30" rx="8" fill="none" stroke="#cbd5e1"/>
  <path d="M341 75v12M335 81h12" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>

  <!-- 搜索框 -->
  <rect x="376" y="64" width="420" height="34" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="396" cy="81" r="6" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
  <path d="M401 86l4 4" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
  <text x="412" y="86" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#94a3b8">搜索标题或正文（支持中文短词）</text>

  <!-- 顶栏右侧按钮 + 视图切换 -->
  <rect x="880" y="64" width="96" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="928" y="86" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#334155">新建文件夹</text>
  <rect x="986" y="64" width="106" height="34" rx="8" fill="#2563eb"/>
  <text x="1039" y="86" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#ffffff">导入文件</text>

  <!-- 左侧文件树 -->
  <rect x="120" y="116" width="288" height="556" fill="#ffffff"/>
  <path d="M408 116v556" stroke="#e2e8f0"/>
  <path d="M146 148l6 6-6 6" stroke="#64748b" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M166 156l6-6M172 156l-6-6" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" opacity="0"/>
  <text x="164" y="155" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#0f172a">示例资料</text>

  <!-- 文件夹行 -->
  <rect x="136" y="176" width="256" height="34" rx="8" fill="#eef2ff"/>
  <path d="M150 188h9l3 4h9" fill="none" stroke="#2563eb" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="178" y="198" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" fill="#1d4ed8">培训素材</text>

  <!-- 文件行 -->
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" fill="#334155">
    <path d="M156 226h10l3 3v11h-13z" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="180" y="238">产品培训.pptx</text>

    <path d="M156 266h10l3 3v11h-13z" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="180" y="278">会议纪要.docx</text>

    <path d="M156 306h10l3 3v11h-13z" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="180" y="318">出口要求.md</text>

    <path d="M156 346h10l3 3v11h-13z" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="180" y="358">报价单.xlsx</text>

    <path d="M156 386h10l3 3v11h-13z" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="180" y="398">登记证扫描.pdf</text>
  </g>

  <!-- 选中行 -->
  <rect x="136" y="212" width="256" height="34" rx="8" fill="#f1f5f9"/>
  <path d="M156 226h10l3 3v11h-13z" fill="none" stroke="#2563eb" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="180" y="238" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a">产品培训.pptx</text>

  <!-- 右侧阅读区 -->
  <text x="436" y="152" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#0f172a">示例-产品培训.pptx</text>
  <text x="436" y="176" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5" fill="#64748b">9.2 MB · pptx · 已索引 · 8 页 · 2 分钟前</text>

  <!-- 工具条 -->
  <g filter="url(#soft)">
    <rect x="436" y="192" width="86" height="32" rx="8" fill="#2563eb"/>
  </g>
  <text x="479" y="213" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">✳ 问 AI</text>
  <rect x="530" y="192" width="66" height="32" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="563" y="213" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5" fill="#334155">大屏</text>
  <rect x="604" y="192" width="72" height="32" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="640" y="213" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5" fill="#334155">下载</text>
  <rect x="684" y="192" width="128" height="32" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="748" y="213" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5" fill="#334155">原版式 · 文字</text>

  <!-- 页码条 -->
  <path d="M408 244h744" stroke="#e2e8f0"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">
    <rect x="436" y="258" width="28" height="28" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="450" y="277" text-anchor="middle" fill="#64748b">⤢</text>
    <path d="M486 272l-6 0M480 266l-6 6 6 6" stroke="#64748b" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="500" y="258" width="44" height="28" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="522" y="277" text-anchor="middle" fill="#0f172a" font-weight="600">4</text>
    <text x="562" y="277" fill="#94a3b8">/ 8</text>
    <path d="M596 272l6 0M602 266l6 6-6 6" stroke="#64748b" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1000" y="258" width="136" height="28" rx="8" fill="#f1f5f9"/>
    <rect x="1002" y="260" width="66" height="24" rx="7" fill="#ffffff"/>
    <text x="1035" y="277" text-anchor="middle" fill="#0f172a">单页</text>
    <text x="1100" y="277" text-anchor="middle" fill="#64748b">连续</text>
  </g>

  <!-- 缩略图栏 -->
  <rect x="436" y="300" width="76" height="360" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <g fill="#ffffff" stroke="#e2e8f0">
    <rect x="446" y="310" width="56" height="34" rx="5"/>
    <rect x="446" y="352" width="56" height="34" rx="5"/>
    <rect x="446" y="436" width="56" height="34" rx="5"/>
    <rect x="446" y="478" width="56" height="34" rx="5"/>
    <rect x="446" y="520" width="56" height="34" rx="5"/>
  </g>
  <rect x="446" y="394" width="56" height="34" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="474" y="416" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#2563eb" font-weight="600">4</text>

  <!-- 页面（原版式） -->
  <rect x="528" y="300" width="608" height="360" rx="10" fill="#f1f5f9"/>
  <g filter="url(#soft)">
    <rect x="596" y="322" width="472" height="316" rx="4" fill="#ffffff" stroke="#e8eef5"/>
  </g>
  <!-- 页面内容：标题条 + 正文骨架 + 图 -->
  <rect x="632" y="352" width="240" height="14" rx="4" fill="#e2e8f0"/>
  <rect x="632" y="386" width="396" height="9" rx="4" fill="#eef2f7"/>
  <rect x="632" y="404" width="360" height="9" rx="4" fill="#eef2f7"/>
  <rect x="632" y="422" width="300" height="9" rx="4" fill="#eef2f7"/>
  <rect x="632" y="456" width="398" height="120" rx="6" fill="#f1f5f9" stroke="#e8eef5"/>
  <circle cx="700" cy="500" r="16" fill="#e2e8f0"/>
  <path d="M676 556l40-34 28 22 26-18 34 30z" fill="#e2e8f0"/>
  <rect x="632" y="594" width="330" height="9" rx="4" fill="#eef2f7"/>
  <rect x="632" y="612" width="250" height="9" rx="4" fill="#eef2f7"/>

  <text x="832" y="676" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#94a3b8">96 DPI 逐页图片渲染，铺满阅读区</text>
</svg>
