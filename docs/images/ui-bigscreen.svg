<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="大屏放映示意图">
  <defs>
    <style>
      .bg{fill:#ffffff}
      .surface{fill:#f6f8fa}
      .deep{fill:#eef1f4}
      .stroke{stroke:#d8dee4}
      .line{stroke:#d8dee4;stroke-width:1}
      .txt{fill:#1f2328;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
      .sub{fill:#57606a;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
      .accent{fill:#1f6feb}
      .btn{fill:#ffffff;stroke:#d8dee4}
      .btnTxt{fill:#1f2328;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;font-size:12px}
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="640"/>

  <!-- 覆盖层 -->
  <rect class="bg stroke" x="30" y="30" width="1140" height="520" rx="14"/>

  <!-- 顶栏 -->
  <rect class="bg" x="31" y="31" width="1138" height="56" rx="13"/>
  <line class="line" x1="30" y1="88" x2="1170" y2="88"/>
  <text class="txt" x="56" y="66" font-size="13.5" font-weight="600">示例-产品培训.pptx</text>

  <rect class="btn" x="396" y="46" width="24" height="24" rx="6"/>
  <path d="M411 52l-5 6 5 6" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linecap="round"/>
  <text class="txt" x="440" y="63" font-size="12.5" font-weight="600">4 / 123</text>
  <rect class="btn" x="508" y="46" width="24" height="24" rx="6"/>
  <path d="M517 52l5 6-5 6" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linecap="round"/>

  <rect class="btn" x="556" y="46" width="140" height="24" rx="7"/>
  <rect class="surface" x="558" y="48" width="66" height="20" rx="5"/>
  <text class="txt" x="576" y="62" font-size="11.5" font-weight="600">单页</text>
  <text class="sub" x="640" y="62" font-size="11.5">连续</text>

  <rect class="accent" x="1040" y="46" width="96" height="28" rx="8"/>
  <text x="1074" y="64" font-size="12.5" fill="#ffffff" font-family="Segoe UI,Microsoft YaHei,sans-serif">恢复</text>

  <!-- 舞台 -->
  <rect class="deep" x="31" y="89" width="1138" height="460" rx="13"/>
  <rect x="266" y="110" width="668" height="376" rx="6" fill="#ffffff" stroke="#d8dee4"/>
  <!-- 幻灯片内容占位 -->
  <rect x="266" y="110" width="668" height="150" rx="6" fill="#e8f0fb"/>
  <rect x="300" y="150" width="180" height="16" rx="5" fill="#c7d9f5"/>
  <rect x="300" y="182" width="260" height="10" rx="4" fill="#d7e3f8"/>
  <rect x="300" y="204" width="220" height="10" rx="4" fill="#d7e3f8"/>
  <rect x="300" y="292" width="220" height="12" rx="4" fill="#eef1f4"/>
  <rect x="300" y="318" width="300" height="10" rx="4" fill="#eef1f4"/>
  <rect x="540" y="292" width="360" height="150" rx="6" fill="#f6f8fa" stroke="#e6eaef"/>
  <rect x="300" y="352" width="200" height="10" rx="4" fill="#eef1f4"/>
  <rect x="300" y="372" width="170" height="10" rx="4" fill="#eef1f4"/>
  <text class="sub" x="600" y="470" font-size="11.5" text-anchor="middle">object-fit: contain —— 整页装下、居中、不裁切</text>

  <!-- 提示 -->
  <text class="sub" x="30" y="586" font-size="12.5">方向键 ← → / PageUp PageDown 翻页 · Esc 或右上角「恢复」回到面板</text>
  <text class="sub" x="30" y="612" font-size="11.5">示意图（实际界面跟随 DSH 主题与窗口宽度）</text>
</svg>
