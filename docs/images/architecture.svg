<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="架构图">
  <defs>
    <style>
      .bg{fill:#ffffff}
      .box{fill:#f6f8fa;stroke:#d8dee4}
      .boxAccent{fill:#eaf2ff;stroke:#a9c7f5}
      .boxDark{fill:#f0f3f6;stroke:#c9d1d9}
      .txt{fill:#1f2328;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
      .sub{fill:#57606a;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
      .mono{fill:#1f2328;font-family:"Cascadia Code",Consolas,monospace}
      .arrow{stroke:#8c959f;stroke-width:1.6;fill:none}
      .dash{stroke:#b6bfc9;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#8c959f"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="760"/>
  <text class="txt" x="40" y="48" font-size="18" font-weight="700">一个插件，两半</text>
  <text class="sub" x="40" y="72" font-size="12.5">浏览器侧只做界面；一切读写、解析、索引都在 Host 进程里</text>

  <!-- 浏览器半部 -->
  <rect class="boxAccent" x="40" y="100" width="470" height="250" rx="12"/>
  <text class="txt" x="62" y="130" font-size="13.5" font-weight="600">浏览器（client.js）</text>
  <rect class="bg" x="62" y="146" width="200" height="46" rx="8" stroke="#a9c7f5"/>
  <text class="mono" x="76" y="166" font-size="11.5">sidebar.panellist</text>
  <text class="sub" x="76" y="182" font-size="11">左栏图标</text>
  <rect class="bg" x="278" y="146" width="210" height="46" rx="8" stroke="#a9c7f5"/>
  <text class="mono" x="292" y="166" font-size="11.5">main[key]</text>
  <text class="sub" x="292" y="182" font-size="11">树 + 阅读器 + 检索</text>
  <rect class="bg" x="62" y="204" width="200" height="46" rx="8" stroke="#a9c7f5"/>
  <text class="mono" x="76" y="224" font-size="11.5">settings.section</text>
  <text class="sub" x="76" y="240" font-size="11">目录 / 缓存 / 向量状态</text>
  <rect class="bg" x="278" y="204" width="210" height="46" rx="8" stroke="#a9c7f5"/>
  <text class="txt" x="292" y="224" font-size="12">阅读器</text>
  <text class="sub" x="292" y="240" font-size="11">缩略图 · 页码 · 单页/连续 · 大屏</text>
  <text class="sub" x="62" y="284" font-size="11.5">无构建步骤：window.__ModuleLoader__.load({ id, factory })</text>
  <text class="sub" x="62" y="304" font-size="11.5">取数只走同源 HTTP，不碰数据库</text>

  <!-- 传输 -->
  <path class="arrow" d="M300 350v26" marker-end="url(#a)"/>
  <path class="arrow" d="M330 376v-26" marker-end="url(#a)"/>
  <text class="sub" x="352" y="370" font-size="11.5">/api/kb/v1/*　（x-kb-client 头 + 启动令牌）</text>

  <!-- Host 半部 -->
  <rect class="box" x="40" y="392" width="470" height="330" rx="12"/>
  <text class="txt" x="62" y="420" font-size="13.5" font-weight="600">Host（index.js）</text>

  <rect class="bg" x="62" y="434" width="130" height="44" rx="8" stroke="#d8dee4"/>
  <text class="mono" x="74" y="453" font-size="10.5">routes.mjs</text>
  <text class="sub" x="74" y="468" font-size="10.5">HTTP 接口</text>

  <rect class="bg" x="204" y="434" width="130" height="44" rx="8" stroke="#d8dee4"/>
  <text class="mono" x="216" y="453" font-size="10.5">pipeline.mjs</text>
  <text class="sub" x="216" y="468" font-size="10.5">解析队列</text>

  <rect class="bg" x="346" y="434" width="142" height="44" rx="8" stroke="#d8dee4"/>
  <text class="mono" x="358" y="453" font-size="10.5">tools.mjs</text>
  <text class="sub" x="358" y="468" font-size="10.5">kb_list/search/read</text>

  <rect class="bg" x="62" y="492" width="130" height="44" rx="8" stroke="#d8dee4"/>
  <text class="mono" x="74" y="511" font-size="10.5">extract.mjs</text>
  <text class="sub" x="74" y="526" font-size="10.5">docx/pptx/xlsx</text>

  <rect class="bg" x="204" y="492" width="130" height="44" rx="8" stroke="#d8dee4"/>
  <text class="mono" x="216" y="511" font-size="10.5">pdf.mjs</text>
  <text class="sub" x="216" y="526" font-size="10.5">pdfjs 文字层</text>

  <rect class="bg" x="346" y="492" width="142" height="44" rx="8" stroke="#d8dee4"/>
  <text class="mono" x="358" y="511" font-size="10.5">chunker.mjs</text>
  <text class="sub" x="358" y="526" font-size="10.5">正文 + 分块</text>

  <rect class="bg" x="62" y="550" width="130" height="44" rx="8" stroke="#d8dee4"/>
  <text class="mono" x="74" y="569" font-size="10.5">index.mjs</text>
  <text class="sub" x="74" y="584" font-size="10.5">FTS5 + 向量</text>

  <rect class="bg" x="204" y="550" width="130" height="44" rx="8" stroke="#d8dee4"/>
  <text class="mono" x="216" y="569" font-size="10.5">preview.mjs</text>
  <text class="sub" x="216" y="584" font-size="10.5">转 PDF → 出图</text>

  <rect class="bg" x="346" y="550" width="142" height="44" rx="8" stroke="#d8dee4"/>
  <text class="mono" x="358" y="569" font-size="10.5">store.mjs</text>
  <text class="sub" x="358" y="584" font-size="10.5">库 / 树 / 正文</text>

  <text class="sub" x="62" y="628" font-size="11.5">复用宿主能力：officeKit（LibreOffice 转 PDF / 渲图）、systemPrompt、tools</text>
  <text class="sub" x="62" y="650" font-size="11.5">不新增 session 事件类型，不改 profile 配置</text>

  <!-- 右侧：存储 + 模型 -->
  <rect class="boxDark" x="560" y="392" width="600" height="150" rx="12"/>
  <text class="txt" x="582" y="420" font-size="13" font-weight="600">本机磁盘</text>
  <text class="mono" x="582" y="444" font-size="11.5">$DSH_HOME/kb/kb.db</text>
  <text class="sub" x="582" y="462" font-size="11">库结构 + 正文 + 分块 + FTS5 索引（+ 可选向量）</text>
  <text class="mono" x="582" y="490" font-size="11.5">$DSH_HOME/kb/files/&lt;docId&gt;.*</text>
  <text class="sub" x="582" y="508" font-size="11">原始文件 · .preview.pdf · .pages/ 大图 · .thumbs/ 缩略图</text>
  <text class="sub" x="582" y="528" font-size="11">卸载插件不删；设置页可一键清理预览缓存</text>

  <rect class="boxAccent" x="560" y="566" width="600" height="156" rx="12"/>
  <text class="txt" x="582" y="594" font-size="13" font-weight="600">模型侧</text>
  <text class="sub" x="582" y="618" font-size="11.5">系统提示只在库非空时注入一段，说明怎么用这三个工具</text>
  <rect class="bg" x="582" y="630" width="168" height="34" rx="7" stroke="#a9c7f5"/>
  <text class="mono" x="594" y="652" font-size="11">kb_list</text>
  <rect class="bg" x="762" y="630" width="168" height="34" rx="7" stroke="#a9c7f5"/>
  <text class="mono" x="774" y="652" font-size="11">kb_search</text>
  <rect class="bg" x="942" y="630" width="168" height="34" rx="7" stroke="#a9c7f5"/>
  <text class="mono" x="954" y="652" font-size="11">kb_read</text>
  <text class="sub" x="582" y="690" font-size="11.5">「问 AI」= 把带 docId 的提问预填进会话，不另造聊天窗，会话日志仍是唯一真相</text>

  <path class="arrow" d="M510 556h30" marker-end="url(#a)"/>
  <path class="arrow" d="M510 640h30" marker-end="url(#a)"/>
</svg>
